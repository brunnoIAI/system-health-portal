<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HR | ImplementAI System Health</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#6C5DD3;--red:#DC2626;--amber:#D97706;--green:#16A34A;--blue:#0284C7;--border:#E5E7EB;--text:#111827;--muted:#9CA3AF;--canvas:#F7F9FC;--font:'Inter',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--canvas);color:#374151;}
.topbar{background:#212B3C;padding:12px 28px;display:flex;align-items:center;gap:16px;}
.topbar img{height:28px;}
.topbar-title{color:#fff;font-size:15px;font-weight:700;}
.topbar-back{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 14px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.topbar-back:hover{background:rgba(255,255,255,.2);}
.container{max-width:1000px;margin:0 auto;padding:28px 24px;}
.hr-tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.hr-tab{padding:10px 22px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:8px;}
.hr-tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.hr-tab.active-red{background:var(--red);border-color:var(--red);color:#fff;}
.hr-tab.active-blue{background:var(--blue);border-color:var(--blue);color:#fff;}
.hr-tab:hover:not(.active):not(.active-red):not(.active-blue){border-color:var(--brand);color:var(--brand);}
.add-btn{margin-left:auto;background:var(--brand);border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:8px;}
.loading{text-align:center;padding:80px;color:var(--muted);}
.loading i{font-size:36px;display:block;margin-bottom:16px;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty i{font-size:48px;display:block;margin-bottom:16px;}
.empty h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.person-row{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:16px;cursor:pointer;margin-bottom:10px;transition:all .15s;}
.person-row:hover{border-color:var(--brand);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px);}
.pav{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;}
.pinfo{flex:1;min-width:0;}
.pname{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;}
.prole{font-size:13px;color:var(--muted);margin-bottom:6px;}
.stage-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px;}
.pmeta{display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.status-badge{font-size:11px;font-weight:700;padding:5px 14px;border-radius:100px;white-space:nowrap;}
.back-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.back-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:7px;}
.del-btn{background:none;border:1.5px solid #FEE2E2;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;color:var(--red);cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:7px;}
.card-header{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:24px 28px;margin-bottom:20px;}
.card-hdr-inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.card-av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0;}
.card-name{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;}
.card-sub{font-size:14px;color:var(--muted);}
.card-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;}
.stages-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.stage-full{grid-column:1/-1;}
@media(max-width:700px){.stages-grid{grid-template-columns:1fr;}.stage-full{grid-column:1;}}
.stage-box{background:#fff;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;}
.stage-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--canvas);border-bottom:1.5px solid var(--border);}
.stage-num{font-size:11px;font-weight:800;padding:4px 12px;border-radius:100px;white-space:nowrap;}
.stage-title{font-size:14px;font-weight:700;color:var(--text);}
.stage-body{padding:16px 18px;}
.field-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.field-lbl{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500;}
.field-input{flex:1;min-width:120px;border:1px solid #D1D5DB;border-radius:6px;padding:6px 11px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);transition:border-color .15s;}
.field-input:focus{border-color:var(--brand);}
.link-input{flex:1;border:1px solid #D1D5DB;border-radius:6px;padding:6px 11px;font-size:12px;font-family:var(--font);outline:none;color:var(--brand);}
.open-link{color:var(--brand);font-size:12px;white-space:nowrap;font-weight:600;text-decoration:none;}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.check-row:last-child{border-bottom:none;}
.check-lbl{font-size:14px;flex:1;line-height:1.4;}
.check-date{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:2px;}
.score-input{width:80px;border:2px solid;border-radius:10px;padding:8px 10px;font-size:22px;font-weight:800;font-family:var(--font);outline:none;text-align:center;}
.on-hold{background:#F3F4F6;border-radius:8px;padding:10px 14px;font-size:13px;color:#6B7280;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.act-log{margin-top:20px;border-top:1.5px solid var(--border);padding-top:18px;}
.act-log-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-inner{background:#fff;border-radius:12px;padding:40px 36px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;}
.modal-sub{font-size:14px;color:var(--muted);margin-bottom:24px;}
.form-field{margin-bottom:16px;}
.form-field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;}
.form-field input,.form-field select{width:100%;border:1px solid #D1D5DB;border-radius:8px;padding:10px 14px;font-family:var(--font);font-size:14px;outline:none;}
.form-field input:focus,.form-field select:focus{border-color:var(--brand);}
.btn-primary{background:var(--brand);border:none;border-radius:8px;padding:11px 20px;color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
.btn-secondary{background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 20px;color:#374151;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<div class="container">
  <div class="hr-tabs" id="hr-tabs">
    <button class="hr-tab active" id="tab-ob" onclick="setView('onboarding')"><i class="fas fa-user-plus"></i> Onboarding</button>
    <button class="hr-tab" id="tab-ex" onclick="setView('exiting')"><i class="fas fa-user-minus"></i> Exiting</button>
    <button class="hr-tab" id="tab-rv" onclick="setView('reviews')"><i class="fas fa-star"></i> Performance Reviews</button>
    <button class="add-btn" id="add-btn" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Person</button>

<script>
// ============================================================
// SUPABASE — created immediately, one client, no dependencies
// ============================================================
const SB = window.supabase.createClient('https://zijhsdhjxohicuoxwytk.supabase.co', 'sb_publishable_eyTc-x0RnwsM5Gs8t53zMg_ySQgnTox');
console.log('HR page: Supabase client ready');

// ============================================================
// STATE
// ============================================================
let view = 'onboarding';
let openId = null;

// ============================================================
// BOOT — load data and render on page load
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  loadAndRender();
});

async function loadAndRender() {
  showLoading();
  if (view === 'onboarding') await renderOnboardingList();
  else if (view === 'exiting') await renderExitingList();
  else await renderReviewsList();
}

function setView(v) {
  view = v;
  openId = null;
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  // Update tab styles
  document.getElementById('tab-ob').className = 'hr-tab' + (v==='onboarding'?' active':'');
  document.getElementById('tab-ex').className = 'hr-tab' + (v==='exiting'?' active-red':'');
  document.getElementById('tab-rv').className = 'hr-tab' + (v==='reviews'?' active-blue':'');
  document.getElementById('add-btn').textContent = v==='reviews' ? '+ Add Review' : '+ Add Person';
  loadAndRender();
  window.scrollTo(0,0);
}

function showLoading() {
  document.getElementById('list-view').innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><div style="font-size:14px;font-weight:600">Loading from Supabase...</div></div>';
}

function sc(s) { const n=parseFloat(s); if(!n)return'#9CA3AF'; if(n<=2)return'#DC2626'; if(n<4)return'#D97706'; return'#16A34A'; }
function sb(s) { const n=parseFloat(s); if(!n)return'#F3F4F6'; if(n<=2)return'#FEE2E2'; if(n<4)return'#FEF3C7'; return'#DCFCE7'; }
function ini(name) { return name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }

// ============================================================
// ONBOARDING LIST
// ============================================================
async function renderOnboardingList() {
  const { data, error } = await SB.from('hr_people').select('*').order('added_at', {ascending: false});
  if (error) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Could not load data</h3><p>' + error.message + '</p></div>'; return; }
  if (!data || !data.length) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-users"></i><h3>No onboarding records yet</h3><p>Click "Add Person" to add someone.</p></div>'; return; }
  document.getElementById('list-view').innerHTML = data.map(p => {
    const s = p.stages || {};
    const stage = getCurrentStage(s);
    const color = stage ? stage.color : '#16A34A';
    const label = stage ? 'Stage ' + stage.num + ': ' + stage.name : 'Completed';
    const start = s.s25?.expectedStart || p.start_date || '';
    const startFmt = start ? new Date(start).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
    return `<div class="person-row" onclick="openOnboarding('${p.id}')">
      <div class="pav" style="background:${color}">${ini(p.name)}</div>
      <div class="pinfo">
        <div class="pname">${p.name}</div>
        <div class="prole">${p.role}${p.email?' &nbsp;·&nbsp; <span style="color:var(--muted)">'+p.email+'</span>':''}</div>
        <span class="stage-pill" style="background:${color}18;color:${color};border:1.5px solid ${color}35">
          ${stage?'<span style="background:'+color+';color:#fff;border-radius:100px;padding:1px 7px;font-size:10px;font-weight:800;margin-right:4px">'+stage.num+'</span>':''}${label}
        </span>
      </div>
      <div class="pmeta">
        ${startFmt?'<div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600">Start</div><div style="font-size:13px;font-weight:700">'+startFmt+'</div></div>':''}
        <span class="status-badge" style="background:${color}18;color:${color};border:1.5px solid ${color}35">${label}</span>
        <i class="fas fa-chevron-right" style="color:var(--muted);font-size:13px"></i>
      </div>
    </div>`;
  }).join('');
}

function getCurrentStage(s) {
  if (!s.s1?.completed) return {key:'s1',num:'1',name:'Evaluation',color:'#6C5DD3'};
  if (!s.s2?.signedDate) return {key:'s2',num:'2',name:'Offer Letter',color:'#0284C7'};
  if (!s.s25?.candidateEmail) return {key:'s25',num:'2.5',name:'Handover to HR',color:'#D97706'};
  const ref1ok = ['Clear','Pass'].includes(s.s3?.ref1Status||'');
  const ref2ok = ['Clear','Pass'].includes(s.s3?.ref2Status||'');
  if (!s.s3?.ref2Received||!s.s3?.ref1Received||!ref1ok||!ref2ok) return {key:'s3',num:'3',name:'Documents',color:'#D97706'};
  if (!s.s4?.screenSignedDate) return {key:'s4',num:'4',name:'NDA & Screening',color:'#DC2626'};
  if (!s.s5?.signedDate) return {key:'s5',num:'5',name:'Contract',color:'#7C3AED'};
  if (!s.s6?.credsSentDate) return {key:'s6',num:'6',name:'Credentials',color:'#059669'};
  if (!s.s7?.confirmedDate) return {key:'s7',num:'7',name:'Confirmation',color:'#059669'};
  if (!s.s8?.mdmDate) return {key:'s8',num:'8',name:'Vanta',color:'#0891B2'};
  if (!s.s9?.clearedDate) return {key:'s9',num:'9',name:'Background Check',color:'#D97706'};
  if (!s.s10?.completedDate) return {key:'s10',num:'10',name:'Service Accounts',color:'#6B7280'};
  return null;
}

// ============================================================
// EXITING LIST
// ============================================================
async function renderExitingList() {
  const { data, error } = await SB.from('hr_exiting').select('*').order('added_at', {ascending: false});
  if (error) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Could not load data</h3><p>' + error.message + '</p></div>'; return; }
  if (!data || !data.length) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-user-minus"></i><h3>No exiting records yet</h3><p>Click "Add Person" to add someone.</p></div>'; return; }
  document.getElementById('list-view').innerHTML = data.map(p => {
    const s = p.stages || {};
    const isTermination = p.exit_type === 'termination';
    const color = isTermination ? '#DC2626' : '#0284C7';
    const done = s.s1?.letterSignedDate && s.s2?.checklistDate && s.s3?.brunnoSignedDate && s.s4?.servicesDate && s.s5?.completedDate;
    const label = done ? 'Fully Terminated' : !s.s1?.noticeDate ? 'Notice Received' : !s.s1?.letterSignedDate ? 'Awaiting Signature' : !s.s2?.checklistDate ? 'Exit Checklist' : !s.s3?.brunnoSignedDate ? 'Sign-off Pending' : !s.s4?.servicesDate ? 'Account Termination' : 'In Progress';
    return `<div class="person-row" onclick="openExiting('${p.id}')">
      <div class="pav" style="background:${color}">${ini(p.name)}</div>
      <div class="pinfo">
        <div class="pname">${p.name} <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;background:${isTermination?'#FEE2E2':'#E0F2FE'};color:${color};margin-left:6px">${isTermination?'Termination':'Resignation'}</span></div>
        <div class="prole">${p.role}</div>
      </div>
      <div class="pmeta">
        <span class="status-badge" style="background:${color}18;color:${color};border:1.5px solid ${color}35">${label}</span>
        <i class="fas fa-chevron-right" style="color:var(--muted);font-size:13px"></i>
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// OPEN PERSON DETAIL
// ============================================================
async function openOnboarding(id) {
  openId = id;
  document.getElementById('list-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  dv.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i></div>';
  const { data: p, error } = await SB.from('hr_people').select('*').eq('id', id).maybeSingle();
  if (error || !p) { dv.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Could not load</h3></div>'; return; }
  dv.innerHTML = buildOnboardingCard(p);
  window.scrollTo(0,0);
}

async function openExiting(id) {
  openId = id;
  document.getElementById('list-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  dv.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i></div>';
  const { data: p, error } = await SB.from('hr_exiting').select('*').eq('id', id).maybeSingle();
  if (error || !p) { dv.innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Could not load</h3></div>'; return; }
  dv.innerHTML = buildExitingCard(p);
  window.scrollTo(0,0);
}

function backToList() {
  openId = null;
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  loadAndRender();
  window.scrollTo(0,0);
}

// ============================================================
// FIELD UPDATE — writes directly to Supabase
// ============================================================
async function updateField(id, fieldPath, value) {
  const isExiting = id.startsWith('EX_');
  const table = isExiting ? 'hr_exiting' : 'hr_people';
  const { data: rec } = await SB.from(table).select('stages,log').eq('id', id).maybeSingle();
  if (!rec) return;
  const stages = rec.stages || {};
  const parts = fieldPath.split('.');
  let obj = stages;
  for (let i=0; i<parts.length-1; i++) { if(!obj[parts[i]])obj[parts[i]]={}; obj=obj[parts[i]]; }
  obj[parts[parts.length-1]] = value;
  const log = (rec.log || []);
  log.unshift({ts:new Date().toISOString(), action:fieldPath+' updated', by:'Brunno'});
  await SB.from(table).update({stages, log:log.slice(0,100), updated_at:new Date().toISOString()}).eq('id', id);
  // Re-render
  if (isExiting) openExiting(id); else openOnboarding(id);
}

async function toggleCheck(id, fieldPath, checkbox) {
  const isExiting = id.startsWith('EX_');
  const table = isExiting ? 'hr_exiting' : 'hr_people';
  const { data: rec } = await SB.from(table).select('stages,log').eq('id', id).maybeSingle();
  if (!rec) return;
  const stages = rec.stages || {};
  const parts = fieldPath.split('.');
  let obj = stages;
  for (let i=0; i<parts.length-1; i++) { if(!obj[parts[i]])obj[parts[i]]={}; obj=obj[parts[i]]; }
  obj[parts[parts.length-1]] = checkbox.checked;
  const dateKey = parts[parts.length-1].replace('Received','Date').replace('completed','interviewDate');
  if (checkbox.checked && !obj[dateKey]) obj[dateKey] = new Date().toISOString().split('T')[0];
  const log = (rec.log || []);
  log.unshift({ts:new Date().toISOString(), action:fieldPath+(checkbox.checked?' checked':' unchecked'), by:'Brunno'});
  await SB.from(table).update({stages, log:log.slice(0,100), updated_at:new Date().toISOString()}).eq('id', id);
  if (isExiting) openExiting(id); else openOnboarding(id);
}

async function toggleService(id, service, checked, fieldPath) {
  const isExiting = id.startsWith('EX_');
  const table = isExiting ? 'hr_exiting' : 'hr_people';
  const { data: rec } = await SB.from(table).select('stages,log').eq('id', id).maybeSingle();
  if (!rec) return;
  const stages = rec.stages || {};
  const parts = fieldPath.split('.');
  let obj = stages;
  for (let i=0; i<parts.length-1; i++) { if(!obj[parts[i]])obj[parts[i]]={}; obj=obj[parts[i]]; }
  let svcs = (obj[parts[parts.length-1]]||'').split(',').map(x=>x.trim()).filter(Boolean);
  if (checked) { if(!svcs.includes(service))svcs.push(service); } else { svcs=svcs.filter(x=>x!==service); }
  obj[parts[parts.length-1]] = svcs.join(', ');
  await SB.from(table).update({stages, updated_at:new Date().toISOString()}).eq('id', id);
  if (isExiting) openExiting(id); else openOnboarding(id);
}

async function deletePerson(id, table) {
  if (!confirm('Remove this person? This cannot be undone.')) return;
  await SB.from(table).delete().eq('id', id);
  backToList();
}

function df(label,val,field,id) { return `<div class="field-row"><i class="fas fa-calendar" style="color:var(--muted);font-size:12px;flex-shrink:0"></i><label class="field-lbl">${label}:</label><input type="date" value="${val||''}" onchange="updateField('${id}','${field}',this.value)" class="field-input" style="max-width:180px"></div>`; }
function lf(label,val,field,id) { return `<div class="field-row" style="margin-top:6px"><i class="fas fa-link" style="color:var(--muted);font-size:12px;flex-shrink:0"></i><input type="url" placeholder="${label}" value="${val||''}" onchange="updateField('${id}','${field}',this.value)" class="link-input">${val?'<a href="'+val+'" target="_blank" class="open-link" style="margin-left:8px"><i class="fas fa-external-link-alt"></i> Open</a>':''}</div>`; }
function cb(label,checked,dateVal,field,id) { const ds=checked&&dateVal?'<span class="check-date">'+new Date(dateVal).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</span>':''; return `<div class="check-row"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;flex:1"><input type="checkbox" ${checked?'checked':''} onchange="toggleCheck('${id}','${field}',this)" style="width:17px;height:17px;accent-color:#6C5DD3;cursor:pointer;flex-shrink:0"><span class="check-lbl" style="font-weight:${checked?600:400}">${label}</span></label>${ds}</div>`; }
function tf(label,val,field,id,type='text') { return `<div class="field-row"><label class="field-lbl">${label}:</label><input type="${type}" value="${val||''}" placeholder="${label}" onchange="updateField('${id}','${field}',this.value)" class="field-input"></div>`; }
function sb_box(num,title,color,content,full=false,hold=false) { return `<div class="stage-box${full?' stage-full':''}"><div class="stage-hdr"><span class="stage-num" style="background:${color}18;color:${color};border:1.5px solid ${color}35">Stage ${num}</span><span class="stage-title">${title}</span>${hold?'<span style="margin-left:auto;font-size:10px;font-weight:700;background:#F3F4F6;color:#6B7280;border-radius:100px;padding:3px 10px">On Hold</span>':''}</div><div class="stage-body">${content}</div></div>`; }

async function renderReviewsList() {
  const { data, error } = await SB.from('hr_reviews').select('*').order('created_at', {ascending: false});
  if (error) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Could not load reviews</h3><p>'+error.message+'</p></div>'; return; }
  if (!data || !data.length) { document.getElementById('list-view').innerHTML = '<div class="empty"><i class="fas fa-star"></i><h3>No performance reviews yet</h3><p>Click "Add Review" to start.</p></div>'; return; }
  const byPerson = {};
  data.forEach(r => { if(!byPerson[r.person_id])byPerson[r.person_id]={name:r.person_name,role:r.person_role,reviews:[]}; byPerson[r.person_id].reviews.push(r); });
  document.getElementById('list-view').innerHTML = Object.entries(byPerson).map(([pid,pd]) => {
    const latest = pd.reviews[0];
    const lastDate = latest.review_date ? new Date(latest.review_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : 'Not set';
    return `<div class="person-row" onclick="openReviews('${pid}')">
      <div class="pav" style="background:#0284C7">${ini(pd.name)}</div>
      <div class="pinfo"><div class="pname">${pd.name}</div><div class="prole">${pd.role}</div>
        <span class="stage-pill" style="background:#E0F2FE;color:#0284C7;border:1.5px solid #0284C735"><i class="fas fa-star" style="font-size:10px"></i> ${pd.reviews.length} review${pd.reviews.length!==1?'s':''}</span>
      </div>
      <div class="pmeta">
        ${latest.score?'<div style="background:'+sb(latest.score)+';border-radius:10px;padding:6px 14px;display:flex;align-items:center;gap:4px"><span style="font-size:18px;font-weight:800;color:'+sc(latest.score)+'">'+latest.score+'</span><span style="font-size:10px;color:'+sc(latest.score)+';font-weight:700">/5</span></div>':''}
        <div style="text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600">Last review</div><div style="font-size:13px;font-weight:700">${lastDate}</div></div>
        <i class="fas fa-chevron-right" style="color:var(--muted);font-size:13px"></i>
      </div>
    </div>`;
  }).join('');
}

async function openReviews(personId) {

    <button class="back-btn" onclick="backToList()"><i class="fas fa-arrow-left"></i> Back</button>

      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${rev.score?'<div style="background:'+sb(rev.score)+';border-radius:8px;padding:4px 12px;display:flex;align-items:center;gap:4px"><span style="font-size:18px;font-weight:800;color:'+sc(rev.score)+'">'+rev.score+'</span><span style="font-size:10px;color:'+sc(rev.score)+';font-weight:700">/5</span></div>':''}
        ${rev.outcome?'<span style="font-size:12px;font-weight:700;padding:4px 12px;border-radius:6px;background:'+(rev.outcome==='Pass'?'#DCFCE7':rev.outcome==='Needs Improvement'?'#FEF3C7':'#F3F4F6')+';color:'+(rev.outcome==='Pass'?'#16A34A':rev.outcome==='Needs Improvement'?'#D97706':'#6B7280')+'">'+rev.outcome+'</span>':''}
        <button onclick="deleteReview('${rev.id}')" style="background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:13px;padding:4px 6px"><i class="fas fa-trash"></i></button>
      </div>
    </div>
    <div class="stage-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Review Date</label><input type="date" value="${rev.review_date||''}" onchange="updateReview('${rev.id}','review_date',this.value)" class="field-input" style="width:100%"></div>
        <div><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Evaluated By</label><input type="text" value="${rev.evaluated_by||''}" placeholder="Name" onchange="updateReview('${rev.id}','evaluated_by',this.value)" class="field-input" style="width:100%"></div>
        <div><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Score (1-5)</label><input type="number" min="1" max="5" step="0.5" value="${rev.score||''}" placeholder="—" onchange="updateReview('${rev.id}','score',this.value)" class="score-input" style="border-color:${sc(rev.score)};color:${sc(rev.score)};background:${sb(rev.score)}"></div>
        <div><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Outcome</label><select onchange="updateReview('${rev.id}','outcome',this.value)" style="border:1.5px solid #D1D5DB;border-radius:8px;padding:8px 14px;font-size:13px;font-family:var(--font);outline:none;width:100%"><option value="">Select</option><option value="Pass" ${rev.outcome==='Pass'?'selected':''}>Pass</option><option value="Needs Improvement" ${rev.outcome==='Needs Improvement'?'selected':''}>Needs Improvement</option><option value="Fail" ${rev.outcome==='Fail'?'selected':''}>Fail</option></select></div>
      </div>
      <div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px"><i class="fas fa-link"></i> Document Link</label>
        <div style="display:flex;align-items:center;gap:8px"><input type="url" value="${rev.doc_link||''}" placeholder="SharePoint or Drive link" onchange="updateReview('${rev.id}','doc_link',this.value)" class="link-input" style="flex:1">${rev.doc_link?'<a href="'+rev.doc_link+'" target="_blank" class="open-link"><i class="fas fa-external-link-alt"></i> Open</a>':''}</div>
      </div>
      <div><label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Notes</label><textarea onchange="updateReview('${rev.id}','notes',this.value)" style="width:100%;border:1px solid #D1D5DB;border-radius:6px;padding:9px 12px;font-size:13px;font-family:var(--font);outline:none;resize:vertical;min-height:70px">${rev.notes||''}</textarea></div>
    </div>
  </div>`;
}

async function addReview(personId, personName, personRole) {
  await SB.from('hr_reviews').insert({person_id:personId,person_name:personName,person_role:personRole,review_date:'',score:null,outcome:'',evaluated_by:'',doc_link:'',notes:'',added_by:'Brunno'});
  openReviews(personId);
}

async function updateReview(reviewId, field, value) {
  await SB.from('hr_reviews').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',reviewId);
  const {data} = await SB.from('hr_reviews').select('person_id').eq('id',reviewId).maybeSingle();
  if (data) openReviews(data.person_id);
}

async function deleteReview(id) {
  const {data} = await SB.from('hr_reviews').select('person_id').eq('id',id).maybeSingle();
  if (!confirm('Delete this review?')) return;
  await SB.from('hr_reviews').delete().eq('id',id);
  if (data) openReviews(data.person_id); else backToList();
}

on (Optional)\n    ├── Lessons (These are videos or interactive lessons via Arcade)\n    └── Quiz\n\n        🎬 Lesson\n        ├── Lesson Title\n        ├── Short Description\n        ├── Extended Description (Optional - if you want to add more info for the leasson)\n        ├── Content URL (video file, Arcade link)\n\n        ❓ Quiz\n        ├── Rules / Instructions (optional - This will a text show to the user before they will take the quiz)\n        ├── Time Limit (minutes)\n        └── Questions [list]\n\n            📝 Question\n            ├── Question Text\n            └── Options [list of 4]\n                - Option Text (1 correct)\n\n📂 Resources (optional - These will be the links to external documents that you want to add in the course)\n├── Resource Title\n├── Short Description\n├── Extended Description (Optional)\n└── Resource Link (URL)```', 'ts': '1758727404.254509', 'type': 'message', 'user': 'U073DBB8ATE'}, {'client_msg_id': '96257D33-E246-47CE-AFFA-78319DF7B7A8', 'is_locked': False, 'latest_reply': '1758705203.916009', 'reply_count': 1, 'reply_users': ['U0739BR37FH'], 'reply_users_count': 1, 'subscribed': False, 'team': 'T06CEGGAW66', 'text': 'Thanks <@U09C2DLQ75Y> <@U0739BR37FH> whats login for it?', 'thread_ts': '1758655048.558039', 'ts': '1758655048.558039', 'type': 'message', 'user': 'U06CBJGQ353'}, {'client_msg_id': '97c4a633-79b2-47d3-9206-e5a54407cb8c', 'reactions': [{'count': 1, 'name': 'raised_hands::skin-tone-4', 'users': ['U06CBJGQ353']}], 'team': 'T06CEGGAW66', 'text': "Hi <@U06CBJGQ353>,\nThe monitoring is now fully set up and ready for review.\n\n*Grafana Access* Login: <https://iai.grafana.net>\n\n*Quick Navigation:*\n\n• PostgreSQL Metrics: left side click on Grafana Logo → Dashboard → ai-os-production → ai-os-production-postgres\n• Synthetic Checks: Grafana Logo → Testing &amp; Synthetics → Synthetics → Checks →click on links of checks to veiw dashboard\n• Alerts: Grafana Logo → Alerts &amp; IRM → Alerting → Alert rules → Grafana-m  'user': 'U08CX1GBU4R'}, {'client_msg_id': 'CE781ECB-C9BE-4F2E-BC04-C77684A400CA', 'team': 'T06CEGGAW66', 'text': 'Its in dev <@U08CX1GBU4R> please see the message above I have explained everything in details and also mentioned timelines\n\nIt will be available for testing mid to end next and when we make it live you will need at-least a day or two to setup courses put in content for each \n\nSo unfortunately we will not have anything start of next week', 'ts': '1757762986.557039', 'type': 'message', 'user': 'U073DBB8ATE'}, {'client_msg_id': 'b0ee22fd-75e7-46a4-8995-2f6c40fdd714', 'team': 'T06CEGGAW66', 'text': '<@U073DBB8ATE> can we make the academy live? We need to show it on a conference Monday. Need to give the login to Aalok. \nHe will show at least the sales part that is ready', 'ts': '1757762495.419889', 'type': 'message', 'user': 'U08CX1GBU4R'}, {'client_msg_id': 'e021167d-c575-4b86-922d-176b2cad1cb5', 'reactions': [{'count': 2, 'name': '+1', 'users': ['U06CBJGQ353', 'U095NGUJV2R']}], 'team': 'T06CEGGAW66', 'text': '<@U06CBJGQ353> <@U08CX1GBU4R> Work on both Billing and Academy has started (Billing was started yesterday, and Academy was started start of this week)\n\nThe team is working on the Academy, and I am building Billing.\n\n*Here is a detailed overview of the development on the Academy* \n\nFor the academy, we have scoped everything out, data structures are ready (which is the most important part of features such as this as it has a alot of objects) academy is relatively simple in terms of business logic, but it requires a lot of actions to be built for example\n\n*Here is a detailed tree of what we are building* \n```AcademyCourse (academy_courses)\n├── Attributes:\n│   ├── id (UUID, Primary Key)\n│   ├── title (String, 150 chars, indexed)\n│   ├── short_description (String, 250 chars)\n│   ├── extended_description (String, nullable)\n│   ├── scope (AIOSCourseScope enum: SALES_TEAM, SUPPORT_TEAM, ANALYST_TEAM, TASK_TEAM, CRM)\n│   ├── logo_url (HttpUrl)\n│   ├── is_active (Boolean, default: True)\n│   ├── created_at (Timestamp)\n│   └── updated_at (Timestamp)\n│\n├── One-to-Many Relationships:\n│   ├── chapters: List[AcademyCourseChapter] (cascade: all, delete, delete-orphan)\n│   └── resources: List[AcademyCourseResource] (cascade: all, delete, delete-orphan)\n│\n└── Dependencies:\n    ├── AcademyTitleMixin\n    ├── AcademyShortDescriptionMixin\n    ├── AcademyExtendedDescriptionMixin\n    ├── UUIDMixin\n    └── TimestampMixin\n\n    AcademyCourseChapter (academy_course_chapters)\n    ├── Attributes:\n    │   ├── id (UUID, Primary Key)\n    │   ├── title (String, 150 chars, indexed)\n    │   ├── short_description (String, 250 chars)\n    │   ├── extended_description (String, nullable)\n    │   ├── order (Integer, unique per course)\n    │   ├── course_id (UUID, Foreign Key → academy_courses.id)\n    │   ├── created_at (Timestamp)\n    │   └── updated_at (Timestamp)\n    │\n    ├── Constraints:\n    │   └── UniqueConstraint(course_id, order) → uq_course_chapter_order\n    │\n    ├── Relationships:\n    │   ├── course: AcademyCourse (Many-to-One, back_populates="chapters")\n    │   ├── materials: List[AcademyCourseChapterMaterial] (One-to-Many, cascade: all, delete, delete-orphan)\n    │   └── quiz: AcademyCourseChapterQuiz (One-to-One, cascade: all, delete, delete-orphan)\n    │\n    └── Dependencies:\n        ├── AcademyTitleMixin\n        ├── AcademyShortDescriptionMixin\n        ├── AcademyExtendedDescriptionMixin\n        ├── UUIDMixin\n        └── TimestampMixin\n\n        AcademyCourseChapterMaterial (academy_course_chapter_materials)\n        ├── Attributes:\n        │   ├── id (UUID, Primary Key)\n        │   ├── title (String, 150 chars, indexed)\n        │   ├── short_description (String, 250 chars)\n        │   ├── extended_description (String, nullable)\n        │   ├── order (Integer, unique per chapter)\n        │   ├── video_url (HttpUrl)\n        │   ├── chapter_id (UUID, Foreign Key → academy_course_chapters.id)\n        │   ├── created_at (Timestamp)\n        │   └── updated_at (Timestamp)\n        │\n        ├── Constraints:\n        │   └── UniqueConstraint(chapter_id, order) → uq_chapter_material_order\n        │\n        ├── Relationships:\n        │   └── chapter: AcademyCourseChapter (Many-to-One, back_populates="materials")\n        │\n        └── Dependencies:\n            ├── AcademyTitleMixin\n            ├── AcademyShortDescriptionMixin\n            ├── AcademyExtendedDescriptionMixin\n            ├── UUIDMixin\n            └── TimestampMixin\n\n        AcademyCourseChapterQuiz (academy_course_chapter_quizzes)\n        ├── Attributes:\n        │   ├── id (UUID, Primary Key)\n        │   ├── rules (String, nullable)\n        │   ├── duration_seconds (Integer)\n        │   ├── chapter_id (UUID, Foreign Key → academy_course_chapters.id)\n        │   ├── created_at (Timestamp)\n        │   └── updated_at (Timestamp)\n        │\n        ├── Relationships:\n        │   ├── chapter: AcademyCourseChapter (One-to-One, back_populates="quiz")\n        │   └── questions: List[AcademyCourseChapterQuizQuestion] (One-to-Many, cascade: all, delete, delete-orphan)\n        │\n        └── Dependencies:\n            ├── UUIDMixin\n            └── TimestampMixin\n\n            AcademyCourseChapterQuizQuestion (academy_course_chapter_quiz_questions)\n            ├── Attributes:\n            │   ├── id (UUID, Primary Key)\n            │   ├── order (Integer, unique per quiz)\n            │   ├── question (String)\n            │   ├── quiz_id (UUID, Foreign Key → academy_course_chapter_quizzes.id)\n            │   ├── created_at (Timestamp)\n            │   └── updated_at (Timestamp)\n            │\n            ├── Constraints:\n            │   └── UniqueConstraint(quiz_id, order) → uq_quiz_question_order\n            │\n            ├── Relationships:\n            │   ├── quiz: AcademyCourseChapterQuiz (Many-to-One, back_populates="questions")\n            │   └── options: List[AcademyCourseChapterQuizQuestionOption] (One-to-Many, cascade: all, delete, delete-orphan)\n            │\n            └── Dependencies:\n                ├── UUIDMixin\n                └── TimestampMixin\n\n                AcademyCourseChapterQuizQuestionOption (academy_course_chapter_quiz_question_options)\n                ├── Attributes:\n                │   ├── id (UUID, Primary Key)\n                │   ├── option (String)\n                │   ├── is_correct (Boolean, default: False)\n                │   ├── question_id (UUID, Foreign Key → academy_course_chapter_quiz_questions.id)\n                │   ├── created_at (Timestamp)\n                │   └── updated_at (Timestamp)\n                │\n                ├── Constraints:\n                │   ├── UniqueConstraint(question_id, option) → uq_quiz_option_value\n                │   └── Index(question_id, unique=True, where is_correct=true) → uq_quiz_single_correct\n                │\n                ├── Relationships:\n                │   └── question: AcademyCourseChapterQuizQuestion (Many-to-One, back_populates="options")\n                │\n                └── Dependencies:\n                    ├── UUIDMixin\n                    └── TimestampMixin\n\n    AcademyCourseResource (academy_course_resources)\n    ├── Attributes:\n    │   ├── id (UUID, Primary Key)\n    │   ├── title (String, 150 chars, indexed)\n    │   ├── short_description (String, 250 chars)\n    │   ├── extended_description (String, nullable)\n    │   ├── order (Integer, unique per course)\n    │   ├── url (HttpUrl) External resource URL\n    │   ├── course_id (UUID, Foreign Key → academy_courses.id)\n    │   ├── created_at (Timestamp)\n    │   └── updated_at (Timestamp)\n    │\n    ├── Constraints:\n    │   └── UniqueConstraint(course_id, order) → uq_course_resource_order\n    │\n    ├── Relationships:\n    │   └── course: AcademyCourse (Many-to-One, back_populates="resources")\n    │\n    └── Dependencies:\n        ├── AcademyTitleMixin\n        ├── AcademyShortDescriptionMixin\n        ├── AcademyExtendedDescriptionMixin\n        ├── UUIDMixin\n        └── TimestampMixin```\n*Here is a simplified version* \n```AcademyCourse\n├── AcademyCourseChapter\n│   ├── AcademyCourseChapterMaterial\n│   └── AcademyCourseChapterQuiz\n│       └── AcademyCourseChapterQuizQuestion\n│           └── AcademyCourseChapterQuizQuestionOption\n└── AcademyCourseResource```\nWe have divided the dev in 3 phases\n1. Actions available to SuperAdmin (Super admin will be able to configure the courses)\n2. Actions available to Normal users (User will be able to explore all aspects of the courses)\n3. Actions related to the interaction with the course \nWe are currently in phase one. All of us have picked an object, and we are building that specific object. You can see an example of this in this <https://github.com/Implementai-iai/platform-backend/pull/243|PR> I just reviewed. This is from <@U083GCMV1QV>. If you open this link, you will see all actions related to a `Resource` in a `Course` are completed and extensively reviewed; similarly, others are being worked on in parallel. Once they are completed, they will be reviewed and will go through final changes. With the first phase completed, we will be able to share a link where you guys can create courses\n\nThe second phase will not take very long, as it does not require many actions Once this is completed, normal users will be able to see courses in their account, they will be able to explore all, but will not be able to take tests, etc\n\nwith in next week, we will complete both Phase 1 and 2\n\nDuring this time, I will be working on the billing and the data structure of the final phase of the Academy.', 'ts': '1757692268.824459', 'type': 'message', 'user': 'U073DBB8ATE'}, {'client_msg_id': '6f2dcad2-96e4-4f5c-861c-a05c1cf6e2d2', 'edited': {'ts': '1757682659.000000', 'user': 'U0739BR37FH'}, 'team': 'T06CEGGAW66', 'text': '<@U06CBJGQ353> pls see here for the UI work files-tmb/T06CEGGAW66-F09CVN7HXH9-556be43a63/demo_0.mp4', 'url_private_download': 'https://files.slack.com/files-pri/T06CEGGAW66-F09CVN7HXH9/download/demo_0.mkv'}], 'reactions': [{'count': 2, 'name': 'fire', 'users': ['U0739BR37FH', 'U06CBJGQ353']}, {'count': 1, 'name': 'raised_hands::skin-tone-3', 'users': ['U0790KJ70FR']}, {'count': 1, 'name': 'raised_hands', 'users': ['U06CBJGQ353']}], 'text': "<@U06CBJGQ353> an update on AIOS MCP\n\nWe have created an MCP out of our AIOS backend, using which we can now use LLMs to configure everything that we can configure via the AIOS client side.\n\nIn the demo attached below, you will see I have configured a support agent with a few lines, but essentially, we can configure or even use the functionalities of AIOS via chat or other LLMs' specific actions\n\nWe are also working on the system-wide Chat, with that, and AIOS MCP combined, setting up agents, etc, will get very simple\n\nNear the end of the demo, I prompted AI to create a call channel, and it stopped. The issue was not at our end. I was getting this error at random times, both on Claude's desktop and web, and in one of my tests, I was able to configure a full agent with a call channel and script, but unfortunately, that was not recorded\n\nFYI <@U0739BR37FH>", 'ts': '1756751109.347219', 'type': 'message', 'upload': False, 'user': 'U073DBB8ATE'}, {'client_msg_id': '702911a9-c23e-4dc9-9eae-b359b40671e1', 'display_as_bot': False, 'edited': {'ts': '1756741577.000000', 'user': 'U083CKBJCVC'}, 'files': [{'file_access': 'visible', 'filetype': 'mp4', 'id': 'F09DT1RF80G', 'mimetype': 'video/mp4', 'permalink': 'https://implement-ai.slack.com/files/U08CX1GBU4R/F09DT1RF80G/implement_ai_-_google_chrome_2025-09-01_20-38-05.mp4', 'permalink_public': 'https://slack-files.com/T06CEGGAW66-F09DT1RF80G-af29af34c5', 'size': 24415486, 'url_private': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09DT1RF80G-0ebf472ecd/implement_ai_-_google_chrome_2025-09-01_20-38-05.mp4', 'url_private_dow ampaign/Supportline Tabs:*:white_check_mark:\n    ◦ Action: Remove toggle elements from Campaign and Supportline tabs.\n• *Task Creation Error Message Handling:*:white_check_mark:\n    ◦ Action: Show an error message when a required field is left empty during task creation.\n• *Realign Tabs in Documents Section:*:white_check_mark:\n    ◦ Action: Reorder tabs to display "Datasource" first, followed by "Documents."\n• *Add AVI as a Supported File Type for Upload:*:white_check_mark:\n    ◦ Action: Include AVI as a valid file type for uploads.\n• *AI Model Field Dropdown Order in Sales/Support Team:*:white_check_mark:\n    ◦ Action: Correct the order of AI models in the dropdown, listing from GPT-5 to GPT-3.\n• *Remove File Size Descriptions and Limit File Types:*:white_check_mark:\n    ◦ New Supported File Types: JPG, PNG, SVG (for both organization and user photos).\n• *Reorder Integrations Menu:*:white_check_mark:\n    ◦ Action: Rearrange the Integrations menu to display Apps first, followed by Calls.\n• *AI Model Field Dropdown Order in Sales/Support Team:*:white_check_mark:\n    ◦ Action: Correct the order of AI models in the dropdown, listing from GPT-5 to GPT-3.\n• *Predefined Fields for Available Variables in Sales/Task Team:*:white_check_mark:\n    ◦ Action: Ensure available variables are displayed predefined without needing to click a dropdown.\n• *Schedule Settings in Sales/Support Team:*:white_check_mark:\n    ◦ Action: Grey out the Schedule Settings in Sales/Support team for now until required.\n• *Campaign and Support Lines in Sales/Support Team:*:white_check_mark:\n    ◦ Action: When selecting Campaigns or Support Lines, ensure actions are displayed more concisely. Use a fixed height and make it scrollable inside a container to avoid excessive scrolling.\n• *Channel Type Dropdown for Sales/Support Team:*:white_check_mark:\n    ◦ Action: Fix the display of email channel types to show Gmail or multiple Outlook options, without specifying emails. It should behave like the "Connect Apps" dropdown.\n• *Text Box Field Size for Agent Creation/Editing:*:white_check_mark:\n    ◦ Action: Adjust the size of text box fields in the Sales Team to ensure they can fit the required information without scrolling.\n• *AI Assist Settings Section:*:white_check_mark:\n    ◦ Action: Grey out the "AI Assist Settings" section in the settings until it is required.\n• *Reorder Settings and Customers in Sales/Support Team:*:white_check_mark:\n    ◦ Action: Reorder the settings in the Sales and Support team. Settings should come before Customers or Leads.\n', 'thread_ts': '1755532685.338809', 'ts': '1755532685.338809', 'type': 'message', 'user': 'U083CKBJCVC'}, {'client_msg_id': 'e719a305-e3db-49b0-aaae-7db171ce078e', 'reactions': [{'count': 1, 'name': '+1', 'users': ['U06CBJGQ353']}], 'team': 'T06CEGGAW66', 'text': 'We will also build the support to create these MCP servers to be used externally as well e.g in Claude desktop or other apps that support MCP.\n\nWe also have added an Experimental feature to be developed in the end that through the AIOS MCP you can access all the Composio apps connected as well. So a single AIOS MCP can be used in external tools as well to leverage all the functionalities we provide.', 'ts': '1755532228.223129', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': '0d12799f-fa65-4565-86c9-884ea2fd889e', 'edited': {'ts': '1755532137.000000', 'user': 'U0739BR37FH'}, 'reactions': [{'count': 1, 'name': '+1', 'users': ['U06CBJGQ353']}], 'team': 'T06CEGGAW66', 'text': 'Also <@U06CBJGQ353>\n\nWe are first prioritizing AIOS MCP over templating - as the MCP would sort of become like a swiss army knife and allow us to do everything we want right now.\n\ne.g\n1. Create whole configs with just a prompt\n2. A soln engg can get the config of an agent from another acct and then copy the prompt in the new acct to recreate\n3. We can feed in client docs to the chat and the agent would automatically create configs using the context\n4. It will be able to get / summarize data from AIOS platform eg calls / CRMs', 'ts': '1755532128.337809', 'type': 'message', 'user': 'U0739BR37FH'}, {'attachments': [{'app_id': 'AJBCW09GU', 'app_unfurl_url': 'https://implementai.sharepoint.com/:w:/s/iai-development/EctCxcIVM3dOpeRRFSyKZIYBrrSz35GfnaCmpv2GhbLSxA?e=gpSQaI', 'blocks': [{'block_id': 'C9zBQ', 'file': {'app_id': 'AJBCW09GU', 'app_provides_file_work_objects': True, 'channels': [], 'comments_count': 0, 'created': 1755532044, 'display_as_bot': False, 'editable': False, 'external_id': 'b!tydWQ4b4BUqSEfsOQmUo94i_5HDIYtFMpzsvGNEPs22vax-616nqTYDtVauks_zs__013JYUOY6LILC4EFJTO5HKLZCRCUWIUZEG', 'external_type': 'app', 'external_url': 'https://implementai.sharepoint.com/:w:/s/iai-development/EctCxcIVM3dOpeRRFSyKZIYBrrSz35GfnaCmpv2GhbLSxA?e=gpSQaI', 'file_access': 'visible', 'filetype': 'docx', 'groups': [], 'has_more_shares': False, 'has_rich_preview': True, 'id': 'F09BL6BK9J4', 'ims': [], 'is_external': True, 'is_modified_by_ai': False, 'is_public': False, 'media_display_type': 'unknown', 'mimetype': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'mode': 'external', 'name': 'AIOS_MCP___Chat_Spec_docx', 'original_h': 1131, 'original_w': 800, 'permalink': 'https://implement-ai.slack.com/files/U08A7K4P0KE/F09BL6BK9J4/aios_mcp___chat_spec_docx', 'pretty_type': 'Word Document', 'public_url_shared': False, 'shares': {}, 'size': 185149, 'thumb_1024': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_1024.png', 'thumb_1024_h': 1024, 'thumb_1024_w': 724, 'thumb_160': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_160.png', 'thumb_360': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_360.png', 'thumb_360_h': 360, 'thumb_360_w': 255, 'thumb_480': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_480.png', 'thumb_480_h': 480, 'thumb_480_w': 340, 'thumb_64': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_64.png', 'thumb_720': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_720.png', 'thumb_720_h': 720, 'thumb_720_w': 509, 'thumb_80': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_80.png', 'thumb_800': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_800.png', 'thumb_800_h': 1131, 'thumb_800_w': 800, 'thumb_960': 'https://files.slack.com/files-tmb/T06CEGGAW66-F09BL6BK9J4-8a839a9a5a/aios_mcp___chat_spec_docx_960.png', 'thumb_960_h': 960, 'thumb_960_w': 679, 'thumb_tiny': 'AwAwACLSJ56E0EnH3SeM02QvxsBPfqB+FKWfPCcZ5OaAHUVHul/55j/vqnjd/EAPoc0ALRRRQAd6KKKACiiigAooooAKQEnGVIpaKACiiigAooooA//Z', 'timestamp': 1755532044, 'title': 'AIOS MCP &amp; Chat Spec.docx', 'url_private': 'https://implementai.sharepoint.com/:w:/s/iai-development/EctCxcIVM3dOpeRRFSyKZIYBrrSz35GfnaCmpv2GhbLSxA?e=gpSQaI', 'user': 'U08A7K4P0KE', 'user_team': 'T06CEGGAW66', 'username': ''}, 'file_id': 'F09BL6BK9J4', 'source': 'remote', 'type': 'file'}], 'bot_id': 'B092RQQR4H5', 'bot_team_id': 'T06CEGGAW66', 'from_url': 'https://implementai.sharepoint.com/:w:/s/iai-development/EctCxcIVM3dOpeRRFSyKZIYBrrSz35GfnaCmpv2GhbLSxA?e=gpSQaI', 'id': 1, 'is_app_unfurl': True}], 'client_msg_id': '1655ab8c-c343-407f-a9c7-2aa407c3bcce', 'reactions': [{'count': 1, 'name': '+1', 'users': ['U073DBB8ATE']}], 'team': 'T06CEGGAW66', 'text': '<@U073DBB8ATE> <@U0790KJ70FR>\n\nAs discussed today - Chat in AIOS specs (Please read it again added a couple of elements, Activity log, Knowledgebase selection support)\n<https://implementai.sharepoint.com/:w:/s/iai-development/ETuj2-rciLVOjlIv01m5024BHfhIgehrUsPx-uumAKCVXQ?e=NQmOcl|Chat in AIOS Spec.docx>\n\nAIOS MCP (For quick configuration)\n<https://implementai.sharepoint.com/:w:/s/iai-development/EctCxcIVM3dOpeRRFSyKZIYBrrSz35GfnaCmpv2GhbLSxA?e=gpSQaI|AIOS MCP &amp; Chat Spec.docx>\n\nFYI <@U06CBJGQ353>', 'ts': '1755532032.799569', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': 'bdb310a4-964c-47fe-886a-e2b18ea559ab', 'team': 'T06CEGGAW66', 'text': 'Notes for AIOS MCP\n\nEasier configuration of Agents (via AIOS MCP)\n```- AIOS MCP (All functions CRUD)\n- MCP exposes all functions of AIOS and gives schema in MCP form\n- Floating chat button on AIOS account - accessible from anywhere\n- Security: MCP only works via the user login token - Use will only be able to use it after logging into AIOS\n- Any edits made by the MCP should be logged separately to identify which actions it made\n- Agent should clearly state what changes it made\n- Allow UNDO of actions\n- Allow referencing using "this" keyword - e.g Edit "this" campaign, MCP agent shd understand which config / campaign is being referred\n\nUse case\n- Create new agents from scratch by giving them existing prompts \n- Edit current agents configuration\n  -&gt; Agent will read campaign details\n  -&gt; Modify based on your input\n  -&gt; Write back campaign details\n- Ask agent to create new tasks\n- Ask agent to add remove steps\n- Ask agent to read data / latest calls / their summary etc\n- Ability to generate CSV / PDF exports\n\n- Ability to generate MCP URLs for use externally e.g in Claude\n- Section to generate AIOS MCP Servers\n\n- EXPERIMENTAL: Allow this MCP to further call other MCPs connected in account via Composio```', 'ts': '1755526024.393429', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': 'ecf9b649-c59a-420d-ad20-03cc724f37ac', 'team': 'T06CEGGAW66', 'text': 'Chat in AIOS discussion notes\n\nChat in AIOS\n```- Chat section in sidebar\n- Second sub sidebar: List of chat sessions\n- UI window\n  - Enter prompt at bottom\n  - Drawer of apps (Easy to accessible)\n    - Open app selector with search\n    - Checking any app connects the MCP in the current chat section\n    - App selection is saved per session\n  - Model selector\n    - Show all available models\n    - Model selection is saved per session\n  - Support for response generation in background (Navigation should not cancel unless pressed cancel manually)\n  - Copy to clipboard\n  \t- prompt\n  \t- response\n  \t- edit prompt &amp; rerun\n  - Regenerate response button on response\n- Response should support the following\n  - Markdown formatting\n  - Support for file uploading\n    - Add support for files (PDF etc) - Check GPT API for supported file inputs\n  - Any code etc markdown element should have copy to clipboard\n  - Ability to visualize data using graphs / tables etc\n  - PDF / CSV generation\n- Ability to interact with AIOS MCP\n- Export chat (txt, PDF, copy to clipboard)\n- Voice input / output```\nI will share a full spec doc tonight', 'ts': '1755525005.259469', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': '0817bc73-c10e-4f65-8116-cedd698b790d', 'is_locked': False, 'latest_reply': '1755530840.023349', 'reply_count': 1, 'reply_users': ['U0739BR37FH'], 'reply_users_count': 1, 'subscribed': False, 'team': 'T06CEGGAW66', 'text': "Ok we can't just swap a logo on the connector? I thought we could", 'thread_ts': '1755332159.468599', 'ts': '1755332159.468599', 'type': 'message', 'user': 'U06CBJGQ353'}, {'client_msg_id': '139be842-6eb5-4099-8ae1-728ea5152556', 'team': 'T06CEGGAW66', 'text': 'Right now by default we use composio s oauth / developer app that they have created in each system', 'ts': '1755331930.197189', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': 'a8a28c21-dac2-474b-9582-538b647d0bde', 'team': 'T06CEGGAW66', 'text': 'We would need to create our own developer apps for that in each system. Its a longer process to create them / get them approved etc. We can start with the main ones and then we can work our way up.', 'ts': '1755331896.727299', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': '8177c4d1-4d1d-46df-a7 ion:*_\n    ◦ Developed a script to automate fetching apps from Composio and add them directly to the Platform.\n    ◦ Compiled a comprehensive CSV listing all available Composio apps and their respective actions.\n    ◦ Currently in the testing phase for app integrations to ensure smooth functionality.\n• _*Billing Conversion Formulas:*_\n    ◦ Implementing billing conversion formulas for both tasks and call services:\n    ◦ _*Tasks:*_\n            • _Input tokens_: 0.00005 IAI credit = 1 AI input token\n            • _Output tokens_: 0.00025 IAI credit = 1 AI output token\n    ◦ _*Calls:*_\n        ▪︎ 0.5 IAI credit = 1 second of call (equivalent to 30 credits per minute)', 'ts': '1752057786.682689', 'type': 'message', 'user': 'U0790KJ70FR'}], 'ok': True, 'oldest': '1752019200.000000', 'pin_count': 0, 'response_metadata': {'next_cursor': 'bmV4dF90czoxNzU5NDA3NDY5NDc1NjM5'}}}, 'tool_slug': 'SLACK_FETCH_CONVERSATION_HISTORY', 'index': 1}, {'response': {'successful': True, 'data': {'channel_actions_count': 0, 'channel_actions_ts': None, 'composio_execution_message': "More main timeline messages are available. Call this action again with cursor='bmV4dF90czoxNzYxMjQxODQ3MDExNjQ5' to fetch the next page.", 'has_more': True, 'messages': [{'client_msg_id': '8FFA1FAF-1162-4987-84DA-11CDF30F3551', 'team': 'T06CEGGAW66', 'text': 'Thanks <@U073DBB8ATE> how about No more than 2 calls per hour from that IP / number? ', 'ts': '1761241817.439939', 'type': 'message', 'user': 'U06CBJGQ353'}, {'client_msg_id': '00f6eba4-95e3-446c-acf6-a39fbbe998e8', 'reactions': [{'count': 1, 'name': '+1::skin-tone-4', 'users': ['U06CBJGQ353']}], 'team': 'T06CEGGAW66', 'text': '*Hi <@U06CBJGQ353>* *<@U06J4TVNZ1U>* \n\nQuick update on the recent changes we made to defend against spamming:\n\n*What was happening before*\nPreviously, whenever the site loaded, the Cloudflare challenge was being triggered *before any user interaction*. At that stage, Cloudflare didn’t have enough behavioral data to accurately decide if a visitor was legitimate or spam. As a result, the challenge was often automatically passed, and tokens were generated too easily.\n\nSpammers were exploiting this by *farming tokens* and reusing them via scripts.\n\n*What we’ve changed*\n• *Token generation:* Tokens are now only generated *after a user fills in the form and clicks submit*.\n•  This gives Cloudflare enough data to distinguish real users from bots, effectively stopping token farming.\n• *Rate limiting:* We’ve also added a new *rate limiting system* on our side.\n•  We can now set limits based on IP, phone, or email — for example:\n    ◦ How many requests are allowed per time window (e.g., per minute/hour/day)\n    ◦ Whether there should be a minimum interval between requests (e.g., 2 minutes apart)\nEven if a spammer passes the Cloudflare challenge, they’ll now be blocked by our rate limiting.\n\n*Next step*\nRight now, *rate limits aren’t active*. Could you please suggest what would be appropriate limits — e.g.\n• how many requests per IP/phone/email,\n• within what time frame, and whether we should enforce a minimum interval between calls?', 'ts': '1761237330.978139', 'type': 'message', 'user': 'U073DBB8ATE'}, {'client_msg_id': 'fcb463f8-909a-432a-b63e-d544fd7707d1', 'root': {'attachments': [{'fallback': 'Loom Video: Urgent Fix Needed for Client Subscription Confusion! ⚠️', 'from_url': 'https://www.loom.com/share/f0ec4ca693c64a2cbe5024803bf3f23e?sid=57d55f7f-1a1f-4c76-b4dd-4afbb5f07fa0', 'id': 1, 'original_url': 'https://www.loom.com/share/f0ec4ca693c64a2cbe5024803bf3f23e?sid=57d55f7f-1a1f-4c76-b4dd-4afbb5f07fa0', 'service_name': 'Loom', 'service_url': 'https://www.loom.com/', 'text': "Hey team, we need to address an urgent issue regarding our client's subscription on iOS. Currently, they see that a thousand credits cost $350, but when they check their usage, it shows 4.1 million credits consumed. This could lead to confusion, suggesting that the client has spent over 1.3 million do de filters for easier navigation.\n\n *8. Correct Status and Duration Across Runs*  \n*Before:* Statuses and durations were inconsistent.\n*Now:* Task, Analyst, and Computer Use runs follow correct statuses (Queued, In Progress, Completed), with accurate duration tracking based on statuses.\n\n *9. Analyst Share Links (No Login Required)* \n*Before:* Share links required login to access.\n*Now:* Share links include built-in authentication and work without requiring login.\n\n *10. Call Ended Reason in Leads Table*  \n*Before:* Call ended reasons were not visible in leads.\n*Now:* Call ended reason is displayed in the Leads table for Sales and Support agents.\n\n *11. Guardrails Injection Update (Critical)* \n*Before:* Guardrails were not consistently enforced across agents.\n*Now:* Guardrails are injected in XML format with strict enforcement across all agents. Existing agent behaviour may slightly change due to improved adherence.\n\n *12. Datasource Visibility in Tasks*  \n*Before:* Datasources were not visible within Tasks during configuration.\n*Now:* Datasources are properly displayed and selectable within Tasks as expected.', 'ts': '1775069655.758239'}], 'client_msg_id': 'c4ac5825-eaf1-4d37-9fd8-f220960e6386', 'language': {'is_reliable': True, 'locale': 'en'}, 'reactions': [{'count': 1, 'name': 'raised_hands::skin-tone-4', 'users': ['U06CBJGQ353']}], 'team': 'T06CEGGAW66', 'text': '<@U06CBJGQ353>, this is the guardrails update we were discussing yesterday\n\n<https://implement-ai.slack.com/archives/C0920TCHML3/p1775069655758239>', 'ts': '1776754437.800989', 'type': 'message', 'user': 'U073DBB8ATE'}, {'client_msg_id': 'acda6895-6232-4b16-b72e-0992b393c375', 'team': 'T06CEGGAW66', 'text': 'I will get that reviewed and updated', 'ts': '1775573270.774699', 'type': 'message', 'user': 'U0739BR37FH'}, {'client_msg_id': 'fed95a19-d7bc-4f4f-a0dc-a3724c44a85d', 'language': {'is_reliable': True, 'locale': 'en'}, 'team': 'T06CEGGAW66', 'text': 'Thats for the admin app sup function closeModal() { document.getElementById('modal-area').style.display='none'; }
document.addEventListener('click', e => { if(e.target===document.getElementById('modal-area'))closeModal(); });

async function submitAdd() {
  const name=(document.getElementById('add-name')?.value||'').trim();
  const role=(document.getElementById('add-role')?.value||'').trim();
  const email=(document.getElementById('add-email')?.value||'').trim();
  const errEl=document.getElementById('add-err');
  if(!name||!role){if(errEl){errEl.textContent='Name and role are required.';errEl.style.display='block';}return;}
  const now=new Date().toISOString();
  if(view==='onboarding'){
    const start=document.getElementById('add-start')?.value||'';
    const stages={s1:{completed:false,interviewDate:'',score:'',outcome:'',notes:''},s2:{sentDate:'',signedDate:''},s25:{candidateEmail:'',expectedStart:start},s3:{requestSentDate:'',fullNameReceived:false,fullAddressReceived:false,idReceived:false,idLink:'',ref1Received:false,ref1Link:'',ref1Status:'',ref2Received:false,ref2Link:'',ref2Status:''},s4:{ndaSentDate:'',ndaSignedDate:'',ndaSignedLink:'',screenSentDate:'',screenSignedDate:'',screenSignedLink:''},s5:{sentBy:'',sentDate:'',signedDate:'',signedLink:''},s6:{credsSentDate:'',iaiEmail:''},s7:{confirmedDate:''},s8:{vantaSentDate:'',policiesDate:'',mdmDate:''},s9:{certnSentDate:'',clearedDate:'',certnLink:''},s10:{services:'',completedDate:''}};
    await SB.from('hr_people').insert({id:'OB_'+Date.now(),name,role,email,start_date:start,added_by:'Brunno',added_at:now,log:[{ts:now,action:'Added to onboarding',by:'Brunno'}],stages});
  } else {
    const type=document.getElementById('add-type')?.value||'resignation';
    const stages={s1:{noticeDate:'',letterSentDate:'',letterSignedDate:'',letterLink:''},s2:{checklistDate:''},s3:{shahzebSentDate:'',shahzebSignedDate:'',peersSentDate:'',peersSignedDate:'',brunnoSignedDate:'',docLink:''},s4:{o365TermDate:'',servicesDate:'',servicesNotes:''},s5:{completedDate:''}};
    await SB.from('hr_exiting').insert({id:'EX_'+Date.now(),name,role,email,exit_type:type,added_by:'Brunno',added_at:now,log:[{ts:now,action:'Added to exiting ('+type+')',by:'Brunno'}],stages});
  }
  closeModal();
  loadAndRender();
}

async function submitReview() {
  const name=(document.getElementById('add-name')?.value||'').trim();
  const role=(document.getElementById('add-role')?.value||'').trim();
  const errEl=document.getElementById('add-err');
  if(!name){if(errEl){errEl.textContent='Name is required.';errEl.style.display='block';}return;}
  const pid='CUSTOM_'+name.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'_'+Date.now();
  await SB.from('hr_reviews').insert({person_id:pid,person_name:name,person_role:role,review_date:'',score:null,outcome:'',evaluated_by:'',doc_link:'',notes:'',added_by:'Brunno'});
  closeModal();
  openReviews(pid);
}
