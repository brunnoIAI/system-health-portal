<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brunno Tavarez - Status Board | Implement AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:#F1F5F9;color:#0F172A;}
.header{background:#0F172A;color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:18px;font-weight:800;}
.header .sub{font-size:11px;opacity:.7;margin-top:2px;}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 12px;font-size:10px;font-weight:700;}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.container{max-width:1280px;margin:0 auto;padding:20px 28px;}
.dept-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.dept-tab{padding:7px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid #E2E8F0;background:#fff;color:#64748B;transition:all .15s;}
.dept-tab.active{border-color:#6C5DD3;background:#6C5DD3;color:#fff;}
.dept-tab .n{opacity:.7;font-size:10px;margin-left:4px;}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;}
.group-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #CBD5E1;}
.group-card.rag-red{border-top-color:#EF4444;}
.group-card.rag-amber{border-top-color:#F59E0B;}
.group-card.rag-green{border-top-color:#22C55E;}
.group-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:#F8FAFC;border-bottom:1px solid #E2E8F0;}
.group-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.rag{width:11px;height:11px;border-radius:50%;display:inline-block;}
.rag-green{background:#22C55E;}.rag-amber{background:#F59E0B;}.rag-red{background:#EF4444;}
.group-count{font-size:10px;font-weight:700;color:#94A3B8;background:#E2E8F0;border-radius:8px;padding:2px 8px;}
.task{padding:12px 16px;border-bottom:1px solid #F1F5F9;}
.task:last-child{border-bottom:none;}
.task-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
.task-num{font-size:10px;font-weight:800;color:#94A3B8;min-width:40px;padding-top:2px;}
.task-title{flex:1;font-size:12.5px;font-weight:700;line-height:1.35;}
.status-pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:9.5px;font-weight:700;margin-bottom:7px;}
.st-todo{background:#F1F5F9;color:#64748B;}
.st-progress{background:#FEF3C7;color:#B45309;}
.st-blocked{background:#FEE2E2;color:#DC2626;}
.st-done{background:#DCFCE7;color:#16A34A;}
.field{display:flex;gap:7px;font-size:11px;line-height:1.45;margin-bottom:4px;}
.field-label{min-width:74px;font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding-top:1px;}
.fl-done{color:#16A34A;}
.fl-todo{color:#D97706;}
.fl-wait{color:#6C5DD3;}
.fl-block{color:#DC2626;}
.fl-eta{color:#0EA5E9;}
.field-text{flex:1;color:#334155;}
.blocker-text{color:#DC2626;font-weight:600;}
.waiting-text{color:#6C5DD3;font-weight:600;}
.eta-text{font-weight:700;color:#0284C7;}
.updated{font-size:10px;color:#94A3B8;text-align:right;margin-top:18px;}
.empty{padding:40px;text-align:center;color:#94A3B8;font-size:13px;}
</style>
</head>
<body>
<div class="header">
  <div><h1>Brunno Tavarez - Status Board</h1><div class="sub">Operational Continuity Lead | Implement AI</div></div>
  <div class="live"><span class="dot"></span>Live</div>
</div>
<div class="container">
  <div class="dept-tabs" id="dept-tabs"></div>
  <div class="board" id="board"></div>
  <div class="updated" id="updated-at"></div>
</div>
<script>
const SB=window.supabase.createClient("https://zijhsdhjxohicuoxwytk.supabase.co","sb_publishable_eyTc-x0RnwsM5Gs8t53zMg_ySQgnTox");
const DEPT_ORDER=['Compliance','Client','HR','Operations','IT Support'];
const DEPT_ICONS={'Compliance':'fa-shield-halved','Client':'fa-handshake','HR':'fa-users','Operations':'fa-gears','IT Support':'fa-headset'};
let currentDept='all',allOpen=[];
function statusPill(s){const m={todo:['st-todo','To Do'],in_progress:['st-progress','In Progress'],blocked:['st-blocked','BLOCKED'],done:['st-done','Done']};const[c,l]=m[s]||['st-todo',s];return `<span class="status-pill ${c}">${l}</span>`;}
function ragFor(t){if(t.status==='blocked')return 'red';if(t.status==='in_progress')return 'amber';if(t.priority==='critical')return 'red';if(t.priority==='high')return 'amber';return 'green';}
function fmtDate(d){if(!d)return '';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const depts={};allOpen.forEach(t=>{const d=t.department||'Operations';depts[d]=(depts[d]||0)+1;});
  const tabs=document.getElementById('dept-tabs');
  tabs.innerHTML=`<div class="dept-tab ${currentDept==='all'?'active':''}" onclick="currentDept='all';render();">All <span class="n">${allOpen.length}</span></div>`+
    DEPT_ORDER.filter(d=>depts[d]).map(d=>`<div class="dept-tab ${currentDept===d?'active':''}" onclick="currentDept='${d}';render();"><i class="fas ${DEPT_ICONS[d]}" style="margin-right:5px;"></i>${d} <span class="n">${depts[d]}</span></div>`).join('');
  let tasks=currentDept==='all'?allOpen:allOpen.filter(t=>(t.department||'Operations')===currentDept);
  const groups={};
  tasks.forEach(t=>{const g=t.group_name||'Other Tasks';if(!groups[g])groups[g]=[];groups[g].push(t);});
  let html='';
  Object.keys(groups).sort().forEach(g=>{
    const ts=groups[g];
    const rag=ts.some(t=>ragFor(t)==='red')?'red':(ts.some(t=>ragFor(t)==='amber')?'amber':'green');
    html+=`<div class="group-card rag-${rag}"><div class="group-head"><div class="group-name"><span class="rag rag-${rag}"></span>${esc(g)}</div><span class="group-count">${ts.length} task${ts.length>1?'s':''}</span></div>`;
    ts.forEach(t=>{
      html+=`<div class="task">
        <div class="task-top"><div class="task-num">${t.task_number?'#'+t.task_number:''}</div><div class="task-title">${esc(t.title)}</div></div>
        ${statusPill(t.status)}
        ${t.done_summary?`<div class="field"><div class="field-label fl-done">Done</div><div class="field-text">${esc(t.done_summary)}</div></div>`:''}
        ${t.remaining_work?`<div class="field"><div class="field-label fl-todo">To Do</div><div class="field-text">${esc(t.remaining_work)}</div></div>`:''}
        ${t.waiting_on?`<div class="field"><div class="field-label fl-wait">Waiting</div><div class="field-text waiting-text">${esc(t.waiting_on)}</div></div>`:''}
        ${t.blocker?`<div class="field"><div class="field-label fl-block">Blocker</div><div class="field-text blocker-text">${esc(t.blocker)}</div></div>`:''}
        ${t.eta_date?`<div class="field"><div class="field-label fl-eta">ETA</div><div class="field-text eta-text">${fmtDate(t.eta_date)}</div></div>`:''}
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('board').innerHTML=html||'<div class="empty">No open tasks in this department.</div>';
  document.getElementById('updated-at').textContent='Auto-updates every 60s | Last refresh: '+new Date().toLocaleTimeString('en-GB');
}
async function load(){
  const{data,err}=await SB.from('brunno_tasks').select('*').order('updated_at',{ascending:false});
  if(err){document.getElementById('board').innerHTML='<div class="empty">Error: '+err.message+'</div>';return;}
  allOpen=data.filter(t=>t.status!=='done'&&t.status!=='cancelled');
  render();
}
load();
setInterval(load,60000);
</script>
</body>
</html>
