name: Sync to IAI repo
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  mirror-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug token length
        run: echo "Token length is ${#TOKEN}"
        env:
          TOKEN: ${{ secrets.IAI_REPO_TOKEN }}

      - name: Push to IAI repo
        run: |
          git remote add iai-repo https://x-access-token:${{ secrets.IAI_REPO_TOKEN }}@github.com/Implementai-iai/system-health-portal.git
          git push iai-repo main
