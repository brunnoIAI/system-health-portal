<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Incident Tracker | ImplementAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#6C5DD3;--dark:#212B3C;--red:#DC2626;--amber:#D97706;--green:#16A34A;
  --blue:#0284C7;--border:#E5E7EB;--text:#111827;--mid:#374151;--muted:#9CA3AF;
  --canvas:#F7F9FC;--white:#fff;--font:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--canvas);color:var(--text);}
/* AUTH */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#131A26,#212B3C);
  display:flex;align-items:center;justify-content:center;z-index:100;}
.login-box{background:#fff;border-radius:16px;padding:44px 40px;width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo img{height:36px;margin-bottom:14px;}
.login-logo h2{font-size:18px;font-weight:700;margin-bottom:4px;}
.login-logo p{font-size:13px;color:var(--muted);}
.lf{margin-bottom:14px;}
.lf label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;}
.lf input{width:100%;border:1px solid #D1D5DB;border-radius:8px;padding:10px 14px;
  font-family:var(--font);font-size:14px;outline:none;}
.lf input:focus{border-color:var(--brand);}
.login-btn{width:100%;background:var(--brand);border:none;border-radius:8px;padding:11px;
  color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
.err-box{color:var(--red);font-size:12px;text-align:center;margin-top:10px;
  display:none;padding:8px 12px;background:#FFF5F5;border-radius:6px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal{background:#fff;border-radius:12px;padding:36px 32px;width:min(760px,95vw);
  max-height:90vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.15);}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px;}
/* APP */
#app{display:none;}
.topbar{background:var(--dark);padding:12px 28px;display:flex;align-items:center;
  gap:16px;position:sticky;top:0;z-index:50;}
.topbar img{height:28px;}
.topbar-title{color:#fff;font-size:15px;font-weight:700;flex:1;}
.topbar-user{display:flex;align-items:center;gap:8px;}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.user-name{font-size:13px;color:rgba(255,255,255,.8);}
.logout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;padding:5px 12px;color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--font);}
/* LAYOUT */
.container{max-width:1200px;margin:0 auto;padding:28px 24px;}
/* STATS BAR */
.stats-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.stat-card{flex:1;min-width:140px;background:#fff;border:1.5px solid var(--border);
  border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.stat-card .num{font-size:28px;font-weight:800;line-height:1;}
.stat-card .lbl{font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
.stat-card.red .num{color:var(--red);}
.stat-card.amber .num{color:var(--amber);}
.stat-card.green .num{color:var(--green);}
.stat-card.blue .num{color:var(--blue);}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border-radius:100px;border:1.5px solid var(--border);
  background:#fff;font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--muted);cursor:pointer;transition:.15s;}
.filter-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.new-btn{margin-left:auto;background:var(--brand);border:none;border-radius:8px;
  padding:9px 18px;color:#fff;font-family:var(--font);font-size:13px;
  font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;}
/* INCIDENT CARDS */
.incident-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;
  margin-bottom:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;}
.incident-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.ic-header{display:flex;align-items:center;gap:12px;padding:16px 20px;}
.ic-sev{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ic-sev.p1{background:var(--red);}
.ic-sev.p2{background:var(--amber);}
.ic-sev.p3{background:var(--blue);}
.ic-sev.p4{background:var(--muted);}
.ic-id{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;min-width:90px;}
.ic-title{font-size:14px;font-weight:700;flex:1;}
.ic-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;}
.badge-open{background:#FEF3C7;color:var(--amber);}
.badge-investigating{background:#DBEAFE;color:var(--blue);}
.badge-contained{background:#FEE2E2;color:var(--red);}
.badge-resolved{background:#DCFCE7;color:var(--green);}
.badge-closed{background:#F3F4F6;color:var(--muted);}
.badge-cat{background:#F5F3FF;color:var(--brand);}
.ic-footer{padding:8px 20px 14px 42px;display:flex;gap:16px;flex-wrap:wrap;}
.ic-foot-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.ic-foot-item i{font-size:11px;}
/* DETAIL PANEL */
.detail-section{margin-bottom:24px;}
.detail-section h4{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);}
.detail-section p{font-size:13px;color:var(--mid);line-height:1.7;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;}
.detail-field .val{font-size:13px;color:var(--text);font-weight:500;}
.timeline-item{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);
  flex-shrink:0;margin-top:4px;}
.tl-date{font-size:11px;font-weight:700;color:var(--muted);min-width:80px;flex-shrink:0;}
.tl-action{font-size:13px;font-weight:600;color:var(--text);}
.tl-actor{font-size:11px;color:var(--muted);}
.tl-notes{font-size:12px;color:var(--mid);margin-top:2px;font-style:italic;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;
  background:#F3F4F6;color:var(--mid);}
.follow-up-row{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border);}
.follow-up-row:last-child{border-bottom:none;}
.fu-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.fu-check.done{background:var(--green);border-color:var(--green);color:#fff;font-size:9px;}
.fu-text{flex:1;font-size:13px;color:var(--text);}
.fu-owner{font-size:11px;color:var(--muted);}
.fu-due{font-size:11px;color:var(--muted);}
/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ff label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted);}
.ff input,.ff select,.ff textarea{width:100%;border:1px solid #D1D5DB;border-radius:8px;
  padding:9px 12px;font-family:var(--font);font-size:13px;outline:none;}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--brand);}
.ff textarea{resize:vertical;min-height:80px;}
.ff-full{grid-column:1/-1;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{background:var(--green);border:none;border-radius:8px;padding:9px 20px;
  color:#fff;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:8px;
  padding:9px 16px;color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer;}
.btn-del{background:none;border:1.5px solid #FEE2E2;border-radius:8px;padding:9px 16px;
  color:var(--red);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
.empty{text-align:center;padding:60px;color:var(--muted);}
.loading{text-align:center;padding:60px;color:var(--muted);}
.loading i{font-size:28px;display:block;margin-bottom:10px;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>

<script>
const SB = window.supabase.createClient('https://zijhsdhjxohicuoxwytk.supabase.co', 'sb_publishable_eyTc-x0RnwsM5Gs8t53zMg_ySQgnTox');

const ALLOWED = '@implementai.io';
const ADMINS = ['brunno@implementai.io'];
let currentUser = null;
let pendingEmail = null;
let allIncidents = [];
let currentFilter = 'all';
let editingId = null;

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function pwValid(v) {
  return v.length >= 10 && /[A-Z]/.test(v) && /[0-9]/.test(v) && /[^a-zA-Z0-9]/.test(v);
}

async function doLogin() {
  var email = (document.getElementById('le').value || '').trim().toLowerCase();
  var errEl = document.getElementById('lerr');
  errEl.style.display = 'none';
  if (!pendingEmail) {
    if (!email.endsWith(ALLOWED)) {
      errEl.textContent = 'Only @implementai.io accounts can access this portal.';
      errEl.style.display = 'block'; return;
    }
    var btn = document.getElementById('login-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
    var res = await SB.from('portal_auth').select('pw_hash').eq('email', email).maybeSingle();
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
    if (res.data && res.data.pw_hash) {
      pendingEmail = email;
      document.getElementById('le').disabled = true;
      document.getElementById('pw-field').style.display = 'block';
      document.getElementById('lpw').focus();
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    } else {
      pendingEmail = email;
      document.getElementById('set-pw-modal').style.display = 'flex';
    }
    return;
  }
  var pw = document.getElementById('lpw').value;
  if (!pw) { errEl.textContent = 'Please enter your password.'; errEl.style.display = 'block'; return; }
  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
  var hash = await sha256(pendingEmail + ':' + pw);
  var authRes = await SB.from('portal_auth').select('pw_hash,failed_attempts,locked_until').eq('email', pendingEmail).maybeSingle();
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
  var authRow = authRes.data;
  if (!authRow || !authRow.pw_hash) { errEl.textContent = 'No password set.'; errEl.style.display = 'block'; return; }
  if (hash !== authRow.pw_hash) {
    var att = (authRow.failed_attempts || 0) + 1;
    await SB.from('portal_auth').update({failed_attempts: att}).eq('email', pendingEmail);
    errEl.textContent = 'Incorrect password. ' + (3 - att) + ' attempts remaining.'; errEl.style.display = 'block'; return;
  }
  await SB.from('portal_auth').update({failed_attempts: 0, last_login: new Date().toISOString()}).eq('email', pendingEmail);
  completeLogin(pendingEmail);
}

async function doSetPassword() {
  var pw1 = document.getElementById('np1').value;
  var pw2 = document.getElementById('np2').value;
  var errEl = document.getElementById('set-pw-err');
  errEl.style.display = 'none';
  if (!pwValid(pw1)) { errEl.textContent = 'Password does not meet requirements.'; errEl.style.display = 'block'; return; }
  if (pw1 !== pw2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
  var hash = await sha256(pendingEmail + ':' + pw1);
  await SB.from('portal_auth').upsert({email: pendingEmail, pw_hash: hash, pw_set_at: new Date().toISOString(), last_login: new Date().toISOString(), failed_attempts: 0});
  document.getElementById('set-pw-modal').style.display = 'none';
  completeLogin(pendingEmail);
}

function completeLogin(email) {
  var parts = email.split('@')[0].split('.');
  var initials = parts.map(function(p) { return p[0] ? p[0].toUpperCase() : ''; }).join('').substring(0,2);
  currentUser = {email: email, initials: initials, isAdmin: ADMINS.indexOf(email) >= 0};
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-av').textContent = initials;
  document.getElementById('user-name').textContent = email.split('@')[0];
  loadIncidents();
}

function doLogout() {
  currentUser = null; pendingEmail = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('le').value = ''; document.getElementById('le').disabled = false;
  document.getElementById('lpw').value = '';
  document.getElementById('pw-field').style.display = 'none';
  document.getElementById('lerr').style.display = 'none';
  document.getElementById('login-btn').innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
}

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('set-pw-btn').addEventListener('click', doSetPassword);
document.getElementById('logout-btn').addEventListener('click', doLogout);
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

// ── LOAD & RENDER ─────────────────────────────────────────────────────────────
async function loadIncidents() {
  document.getElementById('incidents-list').innerHTML = '<div class="loading"><i class="fas fa-spinner"></i>Loading incidents...</div>';
  var res = await SB.from('incidents').select('*');
  if (res.error) {
    document.getElementById('incidents-list').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle" style="font-size:28px;display:block;margin-bottom:10px"></i>Error loading incidents: ' + res.error.message + '</div>';
    return;
  }
  allIncidents = (res.data || []).sort(function(a,b) {
    return (b.date_reported||'') > (a.date_reported||'') ? 1 : -1;
  });
  renderStats();
  renderList();
}

function renderStats() {
  var counts = {open:0, investigating:0, contained:0, resolved:0, closed:0};
  allIncidents.forEach(function(inc) {
    var s = inc.status.toLowerCase().replace(/ /g,'');
    if (counts[s] !== undefined) counts[s]++;
  });
  var total = allIncidents.length;
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat-card blue"><div class="num">' + total + '</div><div class="lbl">Total</div></div>' +
    '<div class="stat-card red"><div class="num">' + (counts.open + counts.investigating + counts.contained) + '</div><div class="lbl">Active</div></div>' +
    '<div class="stat-card amber"><div class="num">' + counts.investigating + '</div><div class="lbl">Investigating</div></div>' +
    '<div class="stat-card green"><div class="num">' + (counts.resolved + counts.closed) + '</div><div class="lbl">Resolved / Closed</div></div>';
}

function sevClass(sev) {
  if (!sev) return 'p4';
  if (sev.startsWith('P1')) return 'p1';
  if (sev.startsWith('P2')) return 'p2';
  if (sev.startsWith('P3')) return 'p3';
  return 'p4';
}

function statusBadge(status) {
  var map = {
    'Open': 'badge-open', 'Investigating': 'badge-investigating',
    'Contained': 'badge-contained', 'Resolved': 'badge-resolved', 'Closed': 'badge-closed'
  };
  return '<span class="badge ' + (map[status] || 'badge-open') + '">' + status + '</span>';
}

function renderList() {
  var filtered = currentFilter === 'all' ? allIncidents :
    allIncidents.filter(function(inc) { return inc.status.toLowerCase() === currentFilter; });
  if (!filtered.length) {
    document.getElementById('incidents-list').innerHTML = '<div class="empty"><i class="fas fa-shield-alt" style="font-size:40px;display:block;margin-bottom:12px"></i><div style="font-size:16px;font-weight:700">No incidents found</div></div>';
    return;
  }
  document.getElementById('incidents-list').innerHTML = filtered.map(function(inc) {
    var systems = (inc.affected_systems || []).join(', ') || 'Not specified';
    var owner = inc.assigned_to || 'Unassigned';
    return '<div class="incident-card" data-id="' + inc.id + '">'
      + '<div class="ic-header">'
        + '<div class="ic-sev ' + sevClass(inc.severity) + '"></div>'
        + '<span class="ic-id">' + inc.id + '</span>'
        + '<span class="ic-title">' + inc.title + '</span>'
        + '<div class="ic-meta">'
          + statusBadge(inc.status)
          + '<span class="badge badge-cat">' + (inc.category || 'Other') + '</span>'
        + '</div>'
      + '</div>'
      + '<div class="ic-footer">'
        + '<span class="ic-foot-item"><i class="fas fa-calendar"></i> ' + (inc.date_reported || 'Unknown') + '</span>'
        + '<span class="ic-foot-item"><i class="fas fa-user"></i> ' + owner + '</span>'
        + '<span class="ic-foot-item"><i class="fas fa-server"></i> ' + systems.substring(0,60) + (systems.length>60?'...':'') + '</span>'
        + (inc.severity ? '<span class="ic-foot-item"><i class="fas fa-exclamation-triangle"></i> ' + inc.severity + '</span>' : '')
      + '</div>'
    + '</div>';
  }).join('');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    renderList();
  });
});

// Click incident to open detail
document.getElementById('incidents-list').addEventListener('click', function(e) {
  var card = e.target.closest('.incident-card');
  if (!card) return;
  var id = card.getAttribute('data-id');
  var inc = allIncidents.find(function(i) { return i.id === id; });
  if (inc) openDetail(inc);
});

// ── DETAIL VIEW ───────────────────────────────────────────────────────────────
function openDetail(inc) {
  var timeline = inc.timeline || [];
  var followUp = inc.follow_up_actions || [];
  var systems = inc.affected_systems || [];
  var people = inc.affected_people || [];
  var isoControls = inc.iso_controls || [];
  var notified = inc.notified_parties || [];
  var evidence = inc.evidence_links || [];

  var html = '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px">'
    + '<div>'
      + '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px">' + inc.id + '</div>'
      + '<h2 style="font-size:18px;font-weight:800;line-height:1.3">' + inc.title + '</h2>'
    + '</div>'
    + '<div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap">' + statusBadge(inc.status) + '<span class="badge badge-cat">' + (inc.category||'Other') + '</span></div>'
  + '</div>'

  + '<div class="detail-grid" style="margin-bottom:20px">'
    + '<div class="detail-field"><label>Severity</label><div class="val">' + (inc.severity||'-') + '</div></div>'
    + '<div class="detail-field"><label>Reported By</label><div class="val">' + (inc.reported_by||'-') + '</div></div>'
    + '<div class="detail-field"><label>Assigned To</label><div class="val">' + (inc.assigned_to||'-') + '</div></div>'
    + '<div class="detail-field"><label>Date Occurred</label><div class="val">' + (inc.date_occurred||'-') + '</div></div>'
    + '<div class="detail-field"><label>Date Reported</label><div class="val">' + (inc.date_reported||'-') + '</div></div>'
    + '<div class="detail-field"><label>Date Resolved</label><div class="val">' + (inc.date_resolved||'-') + '</div></div>'
    + '<div class="detail-field"><label>Impact Scope</label><div class="val">' + (inc.impact_scope||'-') + '</div></div>'
    + '<div class="detail-field"><label>Financial Impact</label><div class="val">' + (inc.financial_impact||'None') + '</div></div>'
  + '</div>'

  + (systems.length ? '<div class="detail-section"><h4>Affected Systems</h4><div class="chips">' + systems.map(function(s){return '<span class="chip">'+s+'</span>';}).join('') + '</div></div>' : '')
  + (people.length ? '<div class="detail-section"><h4>Affected People</h4><div class="chips">' + people.map(function(p){return '<span class="chip">'+p+'</span>';}).join('') + '</div></div>' : '')

  + '<div class="detail-section"><h4>What Happened</h4><p>' + (inc.description||'-') + '</p></div>'
  + '<div class="detail-section"><h4>How Discovered</h4><p>' + (inc.how_discovered||'-') + '</p></div>'
  + '<div class="detail-section"><h4>Root Cause</h4><p>' + (inc.root_cause||'-') + '</p></div>'

  + (timeline.length ? '<div class="detail-section"><h4>Response Timeline</h4>' + timeline.map(function(t){
      return '<div class="timeline-item"><div class="tl-dot"></div><div><div class="tl-date">' + t.date + '</div><div class="tl-action">' + t.action + '</div><div class="tl-actor">By ' + t.actor + '</div>' + (t.notes ? '<div class="tl-notes">' + t.notes + '</div>' : '') + '</div></div>';
    }).join('') + '</div>' : '')

  + '<div class="detail-section"><h4>Containment</h4><p>' + (inc.containment_actions||'-') + '</p></div>'
  + '<div class="detail-section"><h4>Eradication</h4><p>' + (inc.eradication_actions||'-') + '</p></div>'
  + '<div class="detail-section"><h4>Recovery</h4><p>' + (inc.recovery_actions||'-') + '</p></div>'
  + '<div class="detail-section"><h4>Lessons Learned</h4><p>' + (inc.lessons_learned||'-') + '</p></div>'
  + '<div class="detail-section"><h4>Preventive Measures</h4><p>' + (inc.preventive_measures||'-') + '</p></div>'

  + (followUp.length ? '<div class="detail-section"><h4>Follow-up Actions</h4>' + followUp.map(function(f){
      return '<div class="follow-up-row"><div class="fu-check ' + (f.done?'done':'') + '">' + (f.done?'<i class="fas fa-check"></i>':'') + '</div><div class="fu-text">' + f.action + '</div><div class="fu-owner">' + (f.owner||'') + '</div><div class="fu-due">' + (f.due_date||'') + '</div></div>';
    }).join('') + '</div>' : '')

  + (isoControls.length ? '<div class="detail-section"><h4>ISO 27001 Controls</h4><div class="chips">' + isoControls.map(function(c){return '<span class="chip">'+c+'</span>';}).join('') + '</div></div>' : '')
  + (notified.length ? '<div class="detail-section"><h4>Notified Parties</h4><div class="chips">' + notified.map(function(n){return '<span class="chip">'+n+'</span>';}).join('') + '</div></div>' : '')
  + (evidence.length ? '<div class="detail-section"><h4>Evidence</h4><div class="chips">' + evidence.map(function(e){return '<a href="'+e+'" target="_blank" class="chip" style="color:var(--blue)">View</a>';}).join('') + '</div></div>' : '')

  + (inc.closure_notes ? '<div class="detail-section"><h4>Closure Notes</h4><p>' + inc.closure_notes + '</p></div>' : '');

  document.getElementById('detail-content').innerHTML = html;
  var editBtn = document.getElementById('detail-edit-btn');
  if (currentUser && currentUser.isAdmin) {
    editBtn.style.display = '';
    editBtn.onclick = function() { closeDetail(); openForm(inc); };
  } else {
    editBtn.style.display = 'none';
  }
  document.getElementById('detail-modal').style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detail-modal').style.display = 'none';
}
document.getElementById('detail-close-btn').addEventListener('click', closeDetail);

// ── FORM (NEW / EDIT) ─────────────────────────────────────────────────────────
function openForm(inc) {
  editingId = inc ? inc.id : null;
  document.getElementById('form-title').textContent = inc ? 'Edit Incident — ' + inc.id : 'New Incident';
  var v = inc || {};
  document.getElementById('form-content').innerHTML =
    '<div class="form-grid">'
      + '<div class="ff ff-full"><label>Title *</label><input type="text" id="f-title" value="' + (v.title||'') + '" placeholder="Brief description of the incident"></div>'
      + '<div class="ff"><label>Status</label><select id="f-status"><option ' + (v.status==='Open'?'selected':'') + '>Open</option><option ' + (v.status==='Investigating'?'selected':'') + '>Investigating</option><option ' + (v.status==='Contained'?'selected':'') + '>Contained</option><option ' + (v.status==='Resolved'?'selected':'') + '>Resolved</option><option ' + (v.status==='Closed'?'selected':'') + '>Closed</option></select></div>'
      + '<div class="ff"><label>Severity</label><select id="f-severity"><option ' + (v.severity==='P1 Critical'?'selected':'') + '>P1 Critical</option><option ' + (v.severity==='P2 High'||!v.severity?'selected':'') + '>P2 High</option><option ' + (v.severity==='P3 Medium'?'selected':'') + '>P3 Medium</option><option ' + (v.severity==='P4 Low'?'selected':'') + '>P4 Low</option></select></div>'
      + '<div class="ff"><label>Category</label><select id="f-category"><option ' + (v.category==='Account Compromise'?'selected':'') + '>Account Compromise</option><option ' + (v.category==='Social Engineering'?'selected':'') + '>Social Engineering</option><option ' + (v.category==='Phishing'?'selected':'') + '>Phishing</option><option ' + (v.category==='Data Breach'?'selected':'') + '>Data Breach</option><option ' + (v.category==='Unauthorised Access'?'selected':'') + '>Unauthorised Access</option><option ' + (v.category==='Malware'?'selected':'') + '>Malware</option><option ' + (v.category==='System Failure'?'selected':'') + '>System Failure</option><option ' + (v.category==='Other'||!v.category?'selected':'') + '>Other</option></select></div>'
      + '<div class="ff"><label>Date Occurred</label><input type="date" id="f-date-occ" value="' + (v.date_occurred||'') + '"></div>'
      + '<div class="ff"><label>Date Reported</label><input type="date" id="f-date-rep" value="' + (v.date_reported||'') + '"></div>'
      + '<div class="ff"><label>Reported By</label><input type="text" id="f-reported-by" value="' + (v.reported_by||'') + '"></div>'
      + '<div class="ff"><label>Assigned To (Owner)</label><input type="text" id="f-assigned" value="' + (v.assigned_to||'') + '"></div>'
      + '<div class="ff ff-full"><label>Description — What happened?</label><textarea id="f-desc">' + (v.description||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Affected Systems (comma-separated)</label><input type="text" id="f-systems" value="' + ((v.affected_systems||[]).join(', ')) + '"></div>'
      + '<div class="ff ff-full"><label>Affected People (comma-separated)</label><input type="text" id="f-people" value="' + ((v.affected_people||[]).join(', ')) + '"></div>'
      + '<div class="ff ff-full"><label>How Discovered</label><textarea id="f-discovered">' + (v.how_discovered||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Root Cause</label><textarea id="f-rootcause">' + (v.root_cause||'') + '</textarea></div>'
      + '<div class="ff"><label>Impact Scope</label><select id="f-scope"><option ' + (v.impact_scope==='Internal'||!v.impact_scope?'selected':'') + '>Internal</option><option ' + (v.impact_scope==='Client-Facing'?'selected':'') + '>Client-Facing</option><option ' + (v.impact_scope==='Both'?'selected':'') + '>Both</option></select></div>'
      + '<div class="ff"><label>Financial Impact</label><input type="text" id="f-financial" value="' + (v.financial_impact||'') + '" placeholder="e.g. £2,000 refunded"></div>'
      + '<div class="ff ff-full"><label>Containment Actions</label><textarea id="f-contain">' + (v.containment_actions||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Eradication Actions</label><textarea id="f-eradicate">' + (v.eradication_actions||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Recovery Actions</label><textarea id="f-recover">' + (v.recovery_actions||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Lessons Learned</label><textarea id="f-lessons">' + (v.lessons_learned||'') + '</textarea></div>'
      + '<div class="ff ff-full"><label>Preventive Measures</label><textarea id="f-prevent">' + (v.preventive_measures||'') + '</textarea></div>'
      + '<div class="ff"><label>Date Resolved</label><input type="date" id="f-date-res" value="' + (v.date_resolved||'') + '"></div>'
      + '<div class="ff ff-full"><label>Closure Notes</label><textarea id="f-closure">' + (v.closure_notes||'') + '</textarea></div>'
    + '</div>'
    + '<div class="modal-actions">'
      + '<button class="btn-save" id="form-save-btn">Save Incident</button>'
      + (inc ? '<button class="btn-del" id="form-del-btn">Delete</button>' : '')
      + '<button class="btn-cancel" id="form-cancel-btn">Cancel</button>'
    + '</div>';

  document.getElementById('form-save-btn').addEventListener('click', saveIncident);
  document.getElementById('form-cancel-btn').addEventListener('click', function() { document.getElementById('form-modal').style.display = 'none'; });
  if (inc) {
    document.getElementById('form-del-btn').addEventListener('click', function() {
      if (confirm('Delete incident ' + inc.id + '? This cannot be undone.')) deleteIncident(inc.id);
    });
  }
  document.getElementById('form-modal').style.display = 'flex';
}

function gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function ga(id) { var v = gv(id); return v ? v.split(',').map(function(s){return s.trim();}).filter(Boolean) : []; }

async function saveIncident() {
  var title = gv('f-title');
  if (!title) { alert('Title is required.'); return; }
  var payload = {
    title: title,
    status: gv('f-status'),
    severity: gv('f-severity'),
    category: gv('f-category'),
    date_occurred: gv('f-date-occ') || null,
    date_reported: gv('f-date-rep') || null,
    date_resolved: gv('f-date-res') || null,
    reported_by: gv('f-reported-by'),
    assigned_to: gv('f-assigned'),
    description: gv('f-desc'),
    affected_systems: ga('f-systems'),
    affected_people: ga('f-people'),
    how_discovered: gv('f-discovered'),
    root_cause: gv('f-rootcause'),
    impact_scope: gv('f-scope'),
    financial_impact: gv('f-financial'),
    containment_actions: gv('f-contain'),
    eradication_actions: gv('f-eradicate'),
    recovery_actions: gv('f-recover'),
    lessons_learned: gv('f-lessons'),
    preventive_measures: gv('f-prevent'),
    closure_notes: gv('f-closure'),
    updated_at: new Date().toISOString()
  };

  if (editingId) {
    await SB.from('incidents').update(payload).eq('id', editingId);
  } else {
    // Generate next INC ID
    var year = new Date().getFullYear();
    var maxNum = 0;
    allIncidents.forEach(function(inc) {
      var m = inc.id.match(/INC-\d+-(\d+)/);
      if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
    });
    payload.id = 'INC-' + year + '-' + String(maxNum + 1).padStart(3, '0');
    payload.created_at = new Date().toISOString();
    payload.timeline = [];
    payload.evidence_links = [];
    payload.follow_up_actions = [];
    payload.iso_controls = [];
    payload.notified_parties = [];
    await SB.from('incidents').insert(payload);
  }

  document.getElementById('form-modal').style.display = 'none';
  editingId = null;
  loadIncidents();
}

async function deleteIncident(id) {
  await SB.from('incidents').delete().eq('id', id);
  document.getElementById('form-modal').style.display = 'none';
  document.getElementById('detail-modal').style.display = 'none';
  editingId = null;
  loadIncidents();
}

document.getElementById('new-incident-btn').addEventListener('click', function() {
  if (!currentUser || !currentUser.isAdmin) { alert('Only admins can create incidents.'); return; }
  openForm(null);
});

</script>
